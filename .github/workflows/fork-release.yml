name: Fork release

# Builds rohit/changes for this fork and publishes it as a nightly prerelease
# here: the Windows x64 and arm64 desktop installers (exe + blockmap) and the
# corresponding CLI archives. Upstream's release.yml only runs in
# pingdotgg/t3code and needs its runners, relay state and publishing
# credentials; this file reuses its per-platform build, release-desktop.yml,
# without editing it.

on:
  push:
    branches: [rohit/changes]
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: true

permissions:
  # release-desktop.yml reads this run's artifact list.
  actions: read
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      clerk_publishable_key: ${{ steps.connect.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.connect.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.connect.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.connect.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: version
        name: Resolve nightly version
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

      # The shared T3 Connect relay's public identifiers. Upstream reads the
      # same values from its production environment.
      - id: connect
        name: Resolve T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          value() {
            local found
            found="$(sed -n "s/^$1=//p" .env.example | head -n 1)"
            if [[ -z "$found" ]]; then
              echo ".env.example is missing $1" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          {
            echo "clerk_publishable_key=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(value T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.meta.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.meta.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.meta.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/desktop...
              - --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      # @t3tools/desktop#build compiles the Linux browser secret helper,
      # needed for the cross-platform Linux CLI archive that Windows embeds.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      # Two paths under apps/ so the artifact root is apps/, as release-desktop.yml expects.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_windows_x64:
    name: Desktop Windows x64
    needs: [meta, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.meta.outputs.relay_url }}
      label: Windows x64
      runner: windows-latest
      platform: win
      target: exe
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win-x64
      cli_archive: true
      launch_check: false

  desktop_windows_arm64:
    name: Desktop Windows arm64
    needs: [meta, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.meta.outputs.relay_url }}
      label: Windows arm64
      runner: windows-11-arm
      platform: win
      target: exe
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win-arm64
      cli_archive: true
      launch_check: false

  release:
    name: Publish GitHub Release
    needs: [meta, desktop_windows_x64, desktop_windows_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file, so it is written from
      # the bytes that get uploaded.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for required in t3-*-win-x64.tar.gz t3-*-win-arm64.tar.gz \
            *.exe nightly-win.yml; do
            compgen -G "$required" > /dev/null || { echo "Missing release asset: $required" >&2; exit 1; }
          done
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flock ${{ needs.meta.outputs.version }}
          body: Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/nightly*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          token: ${{ github.token }}
